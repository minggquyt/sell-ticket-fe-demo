<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Bán Vé Demo</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .screen {
      background: #334155;
      height: 10px;
      border-radius: 6px;
      margin: 20px 0 35px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .seat {
      padding: 15px 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      border: 2px solid transparent;
    }

    .seat.available {
      background: #10b981;
      color: #fff;
    }

    .seat.available:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .seat.reserved {
      background: #f59e0b;
      color: #fff;
      cursor: not-allowed;
    }

    .seat.sold {
      background: #64748b;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .seat.selected {
      border-color: #38bdf8;
      transform: scale(1.08);
      box-shadow: 0 0 10px #38bdf8;
    }

    .legend {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }

    .panel {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      border: 1px solid #334155;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    .btn-hold {
      background: #38bdf8;
      color: #0f172a;
    }

    .btn-pay {
      background: #22c55e;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .timer {
      color: #f43f5e;
      font-weight: bold;
    }

    .log-box {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 10px;
      min-height: 20px;
    }

    /* Thêm màu cho trạng thái thanh toán dở dang (ví dụ: tím nhạt) */
    .seat.payment_processing {
      background: #8b5cf6;
      color: #fff;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Sơ Đồ Chọn Ghế - Event Live</h1>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#10b981"></div> Trống
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#f59e0b"></div> Đang giữ
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#8b5cf6"></div> Đang thanh toán
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#64748b"></div> Đã bán
      </div>
    </div>

    <div class="screen"></div>
    <div id="seatGrid" class="seat-grid"></div>

    <div class="panel">
      <div><strong>Ghế đang chọn:</strong> <span id="selectedSeatLabel">Chưa chọn</span></div>
      <div><strong>Tổng tiền:</strong> <span id="seatPrice">0 đ</span></div>
      <div id="timerContainer" style="display:none; margin-top: 8px;">
        ⏳ Thời gian giữ chỗ còn lại: <span class="timer" id="countdown">05:00</span>
      </div>

      <button id="btnAction" class="btn btn-hold" disabled onclick="handleAction()">Giữ Ghế (5 Phút)</button>
      <div id="logMessage" class="log-box"></div>
    </div>
  </div>

  <script>
    const EVENT_ID = '22222222-2222-2222-2222-222222222222';
    const USER_ID = '11111111-1111-1111-1111-111111111111';

    let seatsData = [];
    let selectedSeats = []; // Đổi từ 1 object sang mảng
    let countdownInterval = null;
    let isHolding = false;

    async function loadSeats() {
      try {
        const res = await fetch(`http://localhost:3000/api/events/${EVENT_ID}/seats`);
        const result = await res.json();
        if (result.success) {
          seatsData = result.data;
          renderGrid();
        }
      } catch (err) {
        showLog('Không thể tải sơ đồ ghế: ' + err.message, true);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('seatGrid');
      grid.innerHTML = '';

      seatsData.forEach(seat => {
        const el = document.createElement('div');
        el.className = `seat ${seat.status.toLowerCase()}`;

        const isSelected = selectedSeats.some(s => s.id === seat.id);
        if (isSelected) el.classList.add('selected');

        el.innerHTML = `<div>${seat.seat_number}</div><small>${Number(seat.price).toLocaleString()}đ</small>`;

        if (seat.status === 'AVAILABLE') {
          el.onclick = () => toggleSelectSeat(seat);
        }
        grid.appendChild(el);
      });
    }

    // Toggle chọn / hủy chọn ghế
    function toggleSelectSeat(seat) {
      if (isHolding) return;

      const index = selectedSeats.findIndex(s => s.id === seat.id);
      if (index > -1) {
        selectedSeats.splice(index, 1); // Đã có thì bỏ chọn
      } else {
        selectedSeats.push(seat);       // Chưa có thì thêm vào
      }

      updatePanel();
      renderGrid();
    }

    function updatePanel() {
      const label = document.getElementById('selectedSeatLabel');
      const price = document.getElementById('seatPrice');
      const btn = document.getElementById('btnAction');

      if (selectedSeats.length === 0) {
        label.innerText = 'Chưa chọn';
        price.innerText = '0 đ';
        btn.disabled = true;
        btn.innerText = 'Giữ Ghế (5 Phút)';
        return;
      }

      const seatNames = selectedSeats.map(s => s.seat_number).join(', ');
      const totalPrice = selectedSeats.reduce((sum, s) => sum + Number(s.price), 0);

      label.innerText = `${seatNames} (${selectedSeats.length} ghế)`;
      price.innerText = totalPrice.toLocaleString() + ' đ';
      btn.disabled = false;
      btn.innerText = `Giữ ${selectedSeats.length} Ghế (5 Phút)`;
    }

    async function handleAction() {
      const btn = document.getElementById('btnAction');
      const seatIds = selectedSeats.map(s => s.id);

      if (!isHolding) {
        // 1. Giữ ghế (RESERVED)
        btn.disabled = true;
        const res = await fetch('http://localhost:3000/api/seats/reserve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seatIds, userId: USER_ID })
        });
        const data = await res.json();
        if (data.success) {
          isHolding = true;
          btn.innerText = 'Chuyển sang Thanh Toán';
          btn.className = 'btn btn-pay';
          btn.disabled = false;
          startCountdown(data.data.reserved_until);
          loadSeats();
        } else {
          showLog(data.message, true);
          btn.disabled = false;
        }
      } else {
        // 2. Chuyển sang PAYMENT_PROCESSING
        btn.disabled = true;
        const res = await fetch('http://localhost:3000/api/seats/start-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seatIds, userId: USER_ID })
        });
        const data = await res.json();

        if (data.success) {
          showLog('Đang chờ phản hồi từ cổng thanh toán (ghế đã khóa sang PAYMENT_PROCESSING)...');
          loadSeats();

          // Giả lập Webhook trả kết quả sau 3 giây
          setTimeout(async () => {
            await fetch('http://localhost:3000/api/payment/webhook', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ orderId: data.data.orderId, success: true })
            });
            showLog('🎉 Webhook: Thanh toán thành công! Ghế đã chuyển sang SOLD.');
            resetUI();
            loadSeats();
          }, 3000);
        } else {
          showLog(data.message, true);
        }
      }
    }
    function startCountdown(untilTimeStr) {
      document.getElementById('timerContainer').style.display = 'block';
      const target = new Date(untilTimeStr).getTime();

      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        const now = new Date().getTime();
        const distance = target - now;

        if (distance <= 0) {
          clearInterval(countdownInterval);
          showLog('Đã hết hạn giữ chỗ! Ghế đã được giải phóng.', true);
          resetUI();
          loadSeats();
          return;
        }

        const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((distance % (1000 * 60)) / 1000);
        document.getElementById('countdown').innerText =
          `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function resetUI() {
      isHolding = false;
      selectedSeats = [];
      document.getElementById('timerContainer').style.display = 'none';
      const btn = document.getElementById('btnAction');
      btn.className = 'btn btn-hold';
      updatePanel();
    }

    function showLog(msg, isError = false) {
      const box = document.getElementById('logMessage');
      box.style.color = isError ? '#f43f5e' : '#22c55e';
      box.innerText = msg;
    }

    loadSeats();
  </script>
</body>

</html>
